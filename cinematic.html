<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrier Pigeon AI — Cinematic concept</title>
  <meta name="description" content="A cinematic design concept for Carrier Pigeon AI — calm, practical AI for small business." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin="anonymous"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    :root {
      --ink: #151313;
      --paper: #fffdf8;
      --line: #e8e3d8;
      --muted: #6d6962;
      --glass: rgba(72, 62, 76, 0.42);
      --blue: #2087c9;
      --cream: #fbfaf5;
      --shadow: 0 28px 70px rgba(45, 35, 20, 0.16);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--paper);
      font-family: var(--sans);
      color: var(--ink);
      letter-spacing: -0.015em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { width: 100%; overflow-x: hidden; }

    h1, h2, h3 { font-weight: 400; }
    .serif { font-family: var(--serif); font-weight: 400; }
    a { color: inherit; text-decoration: none; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: #d8d2c4; border-radius: 8px; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 720px;
      height: 100vh;
      overflow: hidden;
      background: url("https://playground.bravebrand.com/assets/backgrounds/signal-foundry-painted-city-hero.webp") center / cover no-repeat;
    }
    .heroVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      z-index: 0;
    }
    .heroOverlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        radial-gradient(120% 90% at 18% 92%, rgba(20,12,22,0.55) 0%, rgba(20,12,22,0) 55%),
        linear-gradient(180deg, rgba(18,14,20,0.34) 0%, rgba(18,14,20,0.08) 32%, rgba(18,14,20,0.30) 100%);
    }

    /* glass nav pill */
    .navWrap { position: absolute; top: 22px; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; padding: 0 22px; }
    .navPill {
      display: flex; align-items: center; gap: 26px;
      padding: 9px 9px 9px 18px;
      border-radius: 999px;
      background: rgba(255,253,248,0.14);
      border: 1px solid rgba(255,255,255,0.30);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: 0 10px 34px rgba(20,12,22,0.28);
    }
    .navMark { display: flex; align-items: center; gap: 9px; color: var(--paper); font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
    .navStar { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: var(--paper); color: var(--ink); }
    .navLinks { display: flex; align-items: center; gap: 22px; }
    .navLinks a { color: rgba(255,253,248,0.86); font-size: 13.5px; font-weight: 500; transition: color .2s var(--ease); }
    .navLinks a:hover { color: var(--paper); }
    .navBtn {
      background: var(--ink); color: var(--paper);
      font-size: 13.5px; font-weight: 600;
      padding: 9px 18px; border-radius: 999px; border: none; cursor: pointer;
      transition: transform .2s var(--ease), background .2s var(--ease);
    }
    .navBtn:hover { transform: translateY(-1px); background: #000; }

    .timeLabel {
      position: absolute; top: 30px; right: 30px; z-index: 5;
      text-align: right; color: rgba(255,253,248,0.82);
      font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
      line-height: 1.5; text-transform: uppercase;
      text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    }

    .heroCard {
      position: absolute; left: 40px; bottom: 44px; z-index: 4;
      max-width: 520px;
      padding: 30px 32px 28px;
      border-radius: 24px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.26);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: 0 30px 70px rgba(20,12,22,0.42);
      color: var(--paper);
    }
    .heroEyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,253,248,0.74); margin-bottom: 16px; }
    .heroCard h1 { font-family: var(--serif); font-size: clamp(40px, 4.6vw, 62px); line-height: 0.98; letter-spacing: -0.01em; margin-bottom: 16px; }
    .heroCard p { font-size: 15.5px; line-height: 1.58; color: rgba(255,253,248,0.86); margin-bottom: 20px; }
    .heroCta { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--paper); }
    .heroCta .arrow { transition: transform .25s var(--ease); }
    .heroCta:hover .arrow { transform: translateX(5px); }

    /* ── Sky-garden support section ───────────────────── */
    .skySection { background: var(--paper); padding: 96px 40px; }
    .skyInner { max-width: 1180px; margin: 0 auto; }
    .skyArt {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      height: 58vh; min-height: 520px;
      box-shadow: var(--shadow);
      background: url("https://playground.bravebrand.com/assets/backgrounds/signal-foundry-sky-garden.webp") center / cover no-repeat;
    }
    .skyVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      z-index: 0;
    }
    .skyTint {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(180deg, rgba(32,135,201,0.10) 0%, rgba(20,16,22,0.06) 40%, rgba(20,16,22,0.42) 100%);
    }
    .skyOverlayGrid {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 34px 36px;
    }
    .skyTopRow { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .skyEyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,253,248,0.9); text-shadow: 0 1px 12px rgba(0,0,0,0.35); }
    .notifCard {
      display: flex; align-items: center; gap: 13px;
      padding: 12px 16px; border-radius: 16px;
      background: rgba(255,253,248,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      color: var(--paper); max-width: 290px;
    }
    .notifDot { width: 9px; height: 9px; border-radius: 50%; background: #6ee787; box-shadow: 0 0 0 4px rgba(110,231,135,0.22); flex-shrink: 0; }
    .notifCard .t { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .notifCard .s { font-size: 11.5px; color: rgba(255,253,248,0.78); line-height: 1.3; margin-top: 2px; }
    .skyHeadline { font-family: var(--serif); color: var(--paper); font-size: clamp(34px, 4.4vw, 58px); line-height: 1.0; max-width: 16ch; text-shadow: 0 2px 26px rgba(0,0,0,0.34); }
    .skyAside { font-size: 14.5px; line-height: 1.6; color: rgba(255,253,248,0.88); max-width: 40ch; margin-top: 14px; text-shadow: 0 1px 14px rgba(0,0,0,0.3); }

    /* ── Manifesto ────────────────────────────────────── */
    .manifesto { background: #fdfcf6; padding: 110px 40px; border-top: 1px solid var(--line); }
    .manifestoGrid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 70px; align-items: center; }
    .pixelFlower { width: 100%; max-width: 460px; margin: 0 auto; display: block; mix-blend-mode: multiply; }
    .manifestoCopy p { font-size: 17px; line-height: 1.62; color: var(--muted); margin-bottom: 18px; max-width: 52ch; }
    .manifestoCopy .big { font-family: var(--serif); font-size: clamp(34px, 4vw, 50px); line-height: 1.04; color: var(--ink); letter-spacing: -0.01em; margin-top: 26px; max-width: 18ch; }

    /* ── System / what we build ───────────────────────── */
    .system { background: var(--cream); padding: 108px 40px; border-top: 1px solid var(--line); }
    .systemInner { max-width: 1180px; margin: 0 auto; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blue); margin-bottom: 18px; }
    .systemHead { font-family: var(--serif); font-size: clamp(36px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -0.01em; max-width: 18ch; margin-bottom: 52px; }
    .cardGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .sysCard {
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 20px; padding: 30px 30px 32px;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    }
    .sysCard:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: #ded7c8; }
    .sysNum { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--blue); margin-bottom: 22px; }
    .sysCard h3 { font-family: var(--serif); font-size: 27px; line-height: 1.05; margin-bottom: 12px; letter-spacing: -0.005em; }
    .sysCard p { font-size: 14.5px; line-height: 1.6; color: var(--muted); }

    /* ── Closing CTA ──────────────────────────────────── */
    .closing {
      position: relative; overflow: hidden;
      padding: 140px 40px 0;
      background: url("https://playground.bravebrand.com/assets/backgrounds/signal-foundry-painted-city-hero.webp") center / cover no-repeat;
    }
    .closingOverlay { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(16,12,18,0.78) 0%, rgba(16,12,18,0.62) 50%, rgba(16,12,18,0.86) 100%); }
    .closingInner { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; color: var(--paper); }
    .closingHead { font-family: var(--serif); font-size: clamp(40px, 6vw, 86px); line-height: 1.0; letter-spacing: -0.01em; max-width: 16ch; margin-bottom: 30px; }
    .closingCta { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 600; color: var(--paper); padding-bottom: 90px; }
    .closingCta .arrow { transition: transform .25s var(--ease); }
    .closingCta:hover .arrow { transform: translateX(6px); }
    .footer { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 30px 0 40px; color: rgba(255,253,248,0.78); }
    .footer .fname { font-family: var(--serif); font-size: 26px; color: var(--paper); }
    .footer hr { border: none; border-top: 1px solid rgba(255,255,255,0.18); margin: 18px 0 14px; }
    .footer .ftag { font-size: 13.5px; letter-spacing: 0.02em; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 860px) {
      .navLinks { display: none; }
      .heroCard { left: 16px; right: 16px; bottom: 22px; max-width: none; padding: 24px 22px; }
      .timeLabel { display: none; }
      .skySection { padding: 64px 18px; }
      .skyArt { border-radius: 22px; height: auto; min-height: 460px; }
      .skyOverlayGrid { padding: 22px; }
      .notifCard { display: none; }
      .manifesto { padding: 72px 20px; }
      .manifestoGrid { grid-template-columns: 1fr; gap: 40px; }
      .pixelFlower { max-width: 320px; }
      .system { padding: 72px 20px; }
      .systemHead { margin-bottom: 36px; }
      .cardGrid { grid-template-columns: 1fr; }
      .closing { padding: 96px 20px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" data-presets="react" src="/cinematic.js"></script>
</body>
</html>
